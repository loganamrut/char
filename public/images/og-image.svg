<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Background Decorative Glows -->
  <circle cx="200" cy="150" r="180" fill="#10b981" fill-opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="220" fill="#059669" fill-opacity="0.22" filter="url(#glow)" />

  <!-- Brand Header -->
  <g transform="translate(80, 80)">
    <!-- Logo Badge -->
    <rect width="72" height="72" rx="18" fill="#059669" stroke="#34d399" stroke-width="2"/>
    <text x="36" y="50" font-size="40" font-family="monospace" font-weight="bold" fill="#ffffff" text-anchor="middle">#</text>
    
    <text x="96" y="44" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">CharCount<tspan fill="#34d399">.dev</tspan></text>
    <text x="96" y="68" font-size="16" font-weight="600" fill="#a7f3d0" letter-spacing="1.5">FREE ONLINE CHARACTER COUNTER</text>
  </g>

  <!-- Main Value Proposition Headline -->
  <g transform="translate(80, 230)">
    <text x="0" y="0" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Count Characters, Words &amp;</text>
    <text x="0" y="68" font-size="54" font-weight="900" fill="#34d399" letter-spacing="-1.5">Social Media Limits Instantly</text>
    <text x="0" y="125" font-size="22" font-weight="500" fill="#cbd5e1" max-width="850">
      Accurate Unicode &amp; emoji character counting with or without spaces. 100% private in-browser analysis.
    </text>
  </g>

  <!-- Key Feature Cards -->
  <g transform="translate(80, 430)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="72" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="24" y="32" font-size="14" font-weight="700" fill="#34d399">DUAL COUNTS</text>
      <text x="24" y="54" font-size="16" font-weight="600" fill="#ffffff">With &amp; Without Spaces</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(260, 0)">
      <rect width="240" height="72" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="24" y="32" font-size="14" font-weight="700" fill="#34d399">100% PRIVATE</text>
      <text x="24" y="54" font-size="16" font-weight="600" fill="#ffffff">Client-Side Engine</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(520, 0)">
      <rect width="250" height="72" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="24" y="32" font-size="14" font-weight="700" fill="#34d399">PLATFORM LIMITS</text>
      <text x="24" y="54" font-size="16" font-weight="600" fill="#ffffff">Twitter/X, SMS, Meta</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(790, 0)">
      <rect width="250" height="72" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="24" y="32" font-size="14" font-weight="700" fill="#34d399">ZERO LATENCY</text>
      <text x="24" y="54" font-size="16" font-weight="600" fill="#ffffff">Instant Live Feedback</text>
    </g>
  </g>

  <!-- URL Tag -->
  <g transform="translate(80, 565)">
    <text x="0" y="0" font-size="16" font-weight="600" fill="#94a3b8">https://charcount.dev • Free, Fast &amp; Secure Writing Utility</text>
  </g>
</svg>
